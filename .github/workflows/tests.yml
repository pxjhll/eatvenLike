name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      XDG_DATA_HOME: ${{ github.workspace }}/../shop-acceptance-userdata
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7
        run: |
          # GitHub 下载偶尔回一个不是 zip 的页面：失败就等一会儿重下，最多 5 次
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 --retry-all-errors -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip && unzip -tq godot.zip && break
            echo "Godot download attempt $attempt failed, retrying"; sleep $((attempt * 5))
          done
          unzip -q godot.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
      - name: Import (build class cache)
        run: ./godot --headless --path . --import
      - name: Unified shop acceptance (same manifest as local)
        run: python3 tools/check_shops.py --engine ./godot --profile headless --output _work/ci/headless
      - name: Web pack size and exported scene identity
        run: python3 tools/check_shops.py --engine ./godot --profile web --output _work/ci/web
      # 真窗口 QA 要装 xvfb、跑好几分钟，只在合进 main 时跑，PR 上靠本地跑（省 Actions 分钟数）
      - name: Shop window render and screenshot QA
        if: github.event_name == 'push'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          timeout 180s xvfb-run -a ./godot --path . --rendering-method gl_compatibility --audio-driver Dummy -s tests/render_work_actions.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shop-acceptance
          path: |
            _work/ci/
            .godot/work_actions_capture/*.png
          include-hidden-files: true
