name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
      - name: Import (build class cache)
        run: ./godot --headless --path . --import
      - name: Run tests
        run: timeout 240s ./godot --headless --path . -s tests/run_all.gd
      - name: Shop UI interaction regression
        run: timeout 30s ./godot --headless --path . -s tests/render_shop_ui.gd
      - name: Art shop business interaction regression
        run: timeout 45s ./godot --headless --path . -s tests/render_tea_business.gd
      - name: First-shop tutorial interaction regression
        run: timeout 45s ./godot --headless --path . -s tests/render_guide.gd
      - name: Tuning panel and playtest log regression
        run: timeout 30s ./godot --headless --path . -s tests/render_tuning.gd
      - name: Animated character frame and gameplay regression
        run: |
          timeout 30s ./godot --headless --path . -s tests/test_rabbit_frame_atlas.gd
          timeout 30s ./godot --headless --path . -s tests/test_rabbit_game_visuals.gd
          timeout 30s ./godot --headless --path . -s tests/test_gray_cat_atlas.gd
          timeout 30s ./godot --headless --path . -s tests/test_gray_cat_game.gd
          timeout 30s ./godot --headless --path . -s tests/test_work_actions.gd
          timeout 30s ./godot --headless --path . -s tests/render_work_actions.gd
      # 真窗口 QA 要装 xvfb、跑好几分钟，只在合进 main 时跑，PR 上靠本地跑（省 Actions 分钟数）
      - name: Tea window input and screenshot QA
        if: github.event_name == 'push'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          timeout 180s xvfb-run -a ./godot --path . --rendering-method gl_compatibility --audio-driver Dummy -s tests/render_tea_business.gd
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: tea-qa
          path: docs/qa/tea-business-*.png
