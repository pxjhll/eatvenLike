name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
      - name: Import (build class cache)
        run: ./godot --headless --path . --import
      - name: Run tests
        run: timeout 240s ./godot --headless --path . -s tests/run_all.gd
      - name: Shop layouts match the art scenes
        run: timeout 60s ./godot --headless --path . -s tools/sync_shop_layouts.gd -- --check
      - name: Pancake baseline matches the shop data (re-record with tests/baselines/record_rules.gd)
        run: timeout 120s ./godot --headless --path . -s tests/baselines/record_rules.gd -- --check
      - name: Exported pack keeps every shop scene node (web build converts scenes to binary)
        run: |
          timeout 60s ./godot --headless --path . -s "$PWD/tests/dump_shop_scenes.gd" -- /tmp/scenes-source.txt
          mkdir -p build && touch build/.gdignore
          timeout 180s ./godot --headless --path . --export-pack Web build/check.pck
          timeout 60s ./godot --headless --main-pack build/check.pck -s "$PWD/tests/dump_shop_scenes.gd" -- /tmp/scenes-export.txt
          diff /tmp/scenes-source.txt /tmp/scenes-export.txt
      - name: Generic shop scene - tea shop real-click regression (taps, panels, save, menu, restart, tuning)
        run: timeout 60s ./godot --headless --path . -s tests/render_shop_tea.gd
      - name: Generic shop scene - data-driven tutorial real-click regression
        run: timeout 45s ./godot --headless --path . -s tests/render_shop_guide.gd
      - name: Generic shop scene - HUD extension acceptance and save round trip
        run: timeout 60s ./godot --headless --path . -s tests/render_shop_extend.gd
      - name: Generic shop scene - pancake stall (guide, art, summary, next shop) real-click regression
        run: timeout 60s ./godot --headless --path . -s tests/render_shop_pancake.gd
      - name: Generic shop audio integration
        run: timeout 30s ./godot --headless --path . -s tests/render_shop_audio.gd
      - name: Animated character frame and gameplay regression
        run: |
          timeout 30s ./godot --headless --path . -s tests/test_rabbit_frame_atlas.gd
          timeout 30s ./godot --headless --path . -s tests/test_rabbit_game_visuals.gd
          timeout 30s ./godot --headless --path . -s tests/test_gray_cat_atlas.gd
          timeout 30s ./godot --headless --path . -s tests/test_gray_cat_game.gd
          timeout 30s ./godot --headless --path . -s tests/test_work_action_atlases.gd
          timeout 30s ./godot --headless --path . -s tests/test_work_actions.gd
          timeout 30s ./godot --headless --path . -s tests/render_work_actions.gd
      # 真窗口 QA 要装 xvfb、跑好几分钟，只在合进 main 时跑，PR 上靠本地跑（省 Actions 分钟数）
      - name: Shop window render and screenshot QA
        if: github.event_name == 'push'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          timeout 180s xvfb-run -a ./godot --path . --rendering-method gl_compatibility --audio-driver Dummy -s tests/render_work_actions.gd
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: shop-qa
          path: .godot/work_actions_capture/*.png
          include-hidden-files: true
