name: deploy-web

# 导出 Web 试玩版并发布到 Cloudflare Pages。
# 需要仓库 Secrets：CLOUDFLARE_API_TOKEN（Pages 编辑权限）、CLOUDFLARE_ACCOUNT_ID。
# PR 只在改了导出相关文件时跑，部署到预览分支地址。
# 没配 Secrets 时只导出、把产物上传成 Actions artifact，不部署。
on:
  push:
    branches: [main]
  pull_request:
    paths: [.github/workflows/deploy-web.yml, tools/web/**, tools/prepare_web_export.py, export_presets.cfg]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"
  PAGES_PROJECT: eatvenlike

jobs:
  web:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot and export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm godot.zip
          curl -sSL -o templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $dir
          unzip -q -j templates.tpz 'templates/web_*' -d $dir && rm templates.tpz
          ls $dir
      - name: Import
        run: ./godot --headless --path . --import
      - name: Export Web
        run: |
          mkdir -p build/web && touch build/.gdignore
          ./godot --headless --path . --export-release "Web" build/web/index.html
          python3 tools/prepare_web_export.py "$PWD/build/web"
          cp tools/web/_headers build/web/_headers
          ls -la build/web
          # Cloudflare Pages 单文件上限 25 MiB
          find build/web -type f -size +25M | { ! grep . ; }
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::没有配置 Cloudflare Secrets，跳过部署"
            exit 0
          fi
          npx --yes wrangler@4 pages project list | grep -qw "$PAGES_PROJECT" \
            || npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch main
          branch=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          npx --yes wrangler@4 pages deploy build/web --project-name "$PAGES_PROJECT" \
            --branch "$branch" --commit-hash "$GITHUB_SHA" --commit-dirty=true
