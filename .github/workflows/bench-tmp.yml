# 临时：数值模拟（分析用，合并前删除）
name: bench-tmp
on:
  push:
    branches: [claude/project-thread-3q5s6i]
jobs:
  bench:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
      - run: ./godot --headless --path . --import
      - name: Bench
        run: timeout 600s ./godot --headless --path . -s tools_tmp/bench_upgrade.gd
      - name: Tests
        if: always()
        run: timeout 120s ./godot --headless --path . -s tests/run_all.gd
      - name: Business UI
        if: always()
        run: timeout 45s ./godot --headless --path . -s tests/render_tea_business.gd
