name: bot-temp
on:
  push:
    branches: [claude/project-thread-hc0jxv-bot]
jobs:
  bot:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7
        run: |
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 --retry-all-errors -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip && unzip -tq godot.zip && break
            sleep $((attempt * 5))
          done
          unzip -q godot.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
      - run: ./godot --headless --path . --import
      - run: timeout 900s ./godot --headless --path . -s tools/_bot/stirfry_pace.gd -- save+more6+t15+walk2,save+more6+t15+carry2,save+more6+t15+work15
