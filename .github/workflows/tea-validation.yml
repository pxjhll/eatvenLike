name: tea validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tea:
    if: github.head_ref == 'codex/pxj-42-tea-playable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Prepare font subset (bootstrap)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-wqy-microhei python3-fonttools
          /usr/bin/python3 art_src/graybox/subset_font.py /usr/share/fonts/truetype/wqy/wqy-microhei.ttc
      - name: Download Godot 4.7
        run: |
          curl -fLsS --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
      - name: Import
        run: ./godot --headless --path . --import
      - name: Run full regression suite
        run: ./godot --headless --path . -s tests/run_all.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tea-font
          path: art/ui/graybox_font.ttf
