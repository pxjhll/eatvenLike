name: tea validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tea:
    if: github.head_ref == 'codex/pxj-42-tea-playable'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Download Godot 4.7
        run: |
          curl -fLsS --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
      - name: Import
        run: ./godot --headless --path . --import
      - name: Run full regression suite
        run: timeout 120s ./godot --headless --path . -s tests/run_all.gd
      - name: Real portrait input and screenshot QA
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          xvfb-run -a ./godot --path . --rendering-method gl_compatibility --audio-driver Dummy -s tests/render_tea.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tea-qa
          path: docs/qa/pxj42-*.png
  parse:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check changed GDScript
        run: |
          curl -fLsS --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
          timeout 30s ./godot --headless --path . --import
          for script in tests/test_tea.gd tests/render_tea.gd game/sim/game_sim.gd presentation/graybox/shop_ui.gd presentation/graybox/shop_view.gd; do
            timeout 10s ./godot --headless --path . --check-only -s "$script"
          done
